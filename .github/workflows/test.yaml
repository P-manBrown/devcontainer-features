name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The workflow always runs, so the required check (all-tests) always reports.
# Changes that only touch the generated Feature READMEs skip the heavy tests.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.features.outputs.list }}
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "List the Features under src/"
        id: features
        run: |
          list=$(for f in src/*/devcontainer-feature.json; do basename "$(dirname "$f")"; done | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: "Decide whether the tests need to run"
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && ! [[ "$BASE" =~ ^0+$ ]]; then
            changed=$(git diff --name-only "$BASE" "$HEAD")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^src/[^/]+/README\.md$'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test-scenarios:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.plan.outputs.features) }}
    steps:
      - uses: actions/checkout@v3

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated .

  test-global:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .

  # The one check to require in the ruleset. It does not change when Features are added.
  all-tests:
    needs: [plan, test-scenarios, test-global]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check the results"
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          SCENARIOS: ${{ needs.test-scenarios.result }}
          GLOBAL: ${{ needs.test-global.result }}
        run: |
          echo "plan=$PLAN run=$RUN test-scenarios=$SCENARIOS test-global=$GLOBAL"
          [ "$PLAN" = success ] || exit 1
          if [ "$RUN" = true ]; then
            [ "$SCENARIOS" = success ] && [ "$GLOBAL" = success ]
          else
            [ "$SCENARIOS" = skipped ] && [ "$GLOBAL" = skipped ]
          fi
